
name: Deploy Flutter Web

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Instalar dependências
        working-directory: plataforma_agendamento
        run: flutter pub get

      - name: Gerar versão Web
        working-directory: plataforma_agendamento
        run: flutter build web --release --base-href "/plataforma-simples-de-agendamento-online/"

      - name: Preparar publicação
        uses: actions/upload-pages-artifact@v3
        with:
          path: plataforma_agendamento/build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
